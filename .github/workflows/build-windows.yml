name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install WiX Toolset
        run: choco install wixtoolset --yes --no-progress
      - name: Build and type-check terminal
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and package unsigned MSI
        shell: pwsh
        run: ./scripts/package-msi.ps1 -SkipFrontend
      - name: Verify packaged launcher and repeat launch
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\OrderFlow-1.0.2.msi").Path
          $destination = Join-Path $PWD "dist\MSI Smoke Image"
          $process = Start-Process msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Administrative MSI extraction failed: $($process.ExitCode)" }
          .\scripts\test-packaged-launch.ps1 -ApplicationDirectory "$destination\OrderFlow"
      - uses: actions/upload-artifact@v4
        with:
          name: OrderFlow-windows-msi
          path: dist/OrderFlow-1.0.2.msi
          if-no-files-found: error
          retention-days: 30
